name: MisterNobody
options:
  bundleIdPrefix: com.misternobody
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.2"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "4.43.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  MisterNobody:
    type: application
    platform: iOS
    sources:
      - path: MisterNobody
    info:
      path: MisterNobody/Resources/Info.plist
      properties:
        CFBundleName: MisterNobody
        CFBundleDisplayName: MisterNobody VPN
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UIBackgroundModes:
          - network-authentication
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: MisterNobody/MisterNobody.entitlements
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - target: PacketTunnelExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misternobody.app
        CODE_SIGN_STYLE: Automatic

  PacketTunnelExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnelExtension
    info:
      path: PacketTunnelExtension/Info.plist
      properties:
        CFBundleName: PacketTunnelExtension
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnelExtension/PacketTunnelExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misternobody.app.tunnel
        CODE_SIGN_STYLE: Automatic

schemes:
  MisterNobody:
    build:
      targets:
        MisterNobody: all
        PacketTunnelExtension: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
